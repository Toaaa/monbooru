{{define "partials/relation_unlink_form.html"}}
<form hx-post="/relations/remove" hx-swap="none"
      hx-on::after-request="if(event.detail.successful){window.location.reload()}" {{with .ExtraClass}}class="{{.}}" {{end}}{{with .Edge}}data-edge="{{.}}" {{end}}style="display:inline"
      {{with .Confirm}}hx-confirm="{{.}}"{{end}}>
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  <input type="hidden" name="type" value="{{.Type}}">
  {{with .GroupID}}<input type="hidden" name="group_id" value="{{.}}">{{end}}
  {{with .ImageID}}<input type="hidden" name="image_id" value="{{.}}">{{end}}
  {{with .A}}<input type="hidden" name="a" value="{{.}}">{{end}}
  {{with .B}}<input type="hidden" name="b" value="{{.}}">{{end}}
  <button type="submit" class="btn-link-accent"{{with .Title}} title="{{.}}"{{end}}>{{.Label}}</button>
</form>
{{end}}
