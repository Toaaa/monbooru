{{define "partials/range_field.html"}}
<div class="field range-row">
  <label for="{{.Name}}">{{.Label}}</label>
  <output id="{{.Name}}_out">{{.Value}}</output>
  <div class="range-slider-row">
    <span class="range-bound range-bound-min">{{.Min}}</span>
    <input type="range" name="{{.Name}}" id="{{.Name}}"
           min="{{.Min}}" max="{{.Max}}" step="{{.Step}}" value="{{.Value}}" list="{{.Name}}_ticks"
           oninput="document.getElementById('{{.Name}}_out').value=this.value">
    <span class="range-bound range-bound-max">{{.Max}}</span>
  </div>
  <datalist id="{{.Name}}_ticks">
    {{range .Ticks}}<option value="{{.}}"></option>{{end}}
  </datalist>
  {{if .Hint}}<span class="field-hint">{{.Hint}}</span>{{end}}
</div>
{{end}}
