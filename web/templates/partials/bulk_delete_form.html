{{define "partials/bulk_delete_form.html"}}
<form hx-post="{{.Action}}"
      {{if .Target}}hx-target="{{.Target}}" hx-swap="innerHTML"{{end}}
      hx-on::after-request="if(event.detail.successful){setTimeout(function(){window.location.reload()},1500)}"
      hx-confirm="{{.Confirm}}"
      {{if .ConfirmDanger}}data-confirm-danger="{{.ConfirmDanger}}"
      {{end}}data-confirm-ok="{{.ConfirmOK}}"
      style="display:inline">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  {{if .All}}<input type="hidden" name="all" value="true">{{end}}
  <button type="submit" class="btn-danger btn-sm">{{.Label}}</button>
</form>
{{end}}
