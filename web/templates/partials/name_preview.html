{{define "partials/name_preview.html"}}
{{if .Error}}
<div class="name-preview-err">{{with .Field}}<span class="name-preview-field">{{.}}:</span> {{end}}{{.Error}}</div>
{{else}}
<div class="name-preview">
  {{with .Caption}}<span class="name-preview-cap">{{.}}</span>{{end}}
  {{with .Note}}<span class="name-preview-note">{{.}}</span>{{end}}
  <dl class="name-preview-rows">
    {{range .Rows}}<dt class="name-preview-from" title="{{.FromFull}}">{{.From}}</dt><dd class="name-preview-to">{{.To}}</dd>{{end}}
  </dl>
  {{if .More}}<button type="button" class="name-preview-more" data-rows="{{.NextRows}}" onclick="showMoreNamePreview(this)">show more</button>{{end}}
</div>
{{end}}
{{end}}
